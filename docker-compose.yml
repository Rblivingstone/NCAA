# docker compose up -d --build   (settings come from .env; see deploy/deploy.sh)
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      NCAA_SEASON: ${NCAA_SEASON:-2026}
      NCAA_LIVE_SEASON: ${NCAA_LIVE_SEASON:-2027}
    volumes:
      - artifacts:/app/artifacts
      - data:/app/data
    # Reachable only from this machine; Caddy below, or the host's own nginx/Apache/Caddy, proxies to it.
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/static/style.css', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["deploy/worker.sh"]
    environment:
      NCAA_SEASON: ${NCAA_SEASON:-2026}
      NCAA_LIVE_SEASON: ${NCAA_LIVE_SEASON:-2027}
      BOOTSTRAP_FIT: ${BOOTSTRAP_FIT:-vi}
      NIGHTLY_FIT: ${NIGHTLY_FIT:-vi}
      NIGHTLY_HOUR: ${NIGHTLY_HOUR:-10}
      WATCH_EVERY: ${WATCH_EVERY:-60}
      PROJECT_SIMS: ${PROJECT_SIMS:-1000}
    volumes:
      - artifacts:/app/artifacts
      - data:/app/data

  # The women's league: the same jobs, its own files (data/wbb, artifacts/wbb). Its nightly run is two hours after the
  # men's so the two refits never compete for memory.
  worker-womens:
    build: .
    restart: unless-stopped
    command: ["deploy/worker.sh"]
    environment:
      NCAA_LEAGUE: womens
      NCAA_SEASON: ${NCAA_SEASON:-2026}
      NCAA_LIVE_SEASON: ${NCAA_LIVE_SEASON:-2027}
      BOOTSTRAP_FIT: ${BOOTSTRAP_FIT:-vi}
      NIGHTLY_FIT: ${NIGHTLY_FIT:-vi}
      NIGHTLY_HOUR: ${WOMENS_NIGHTLY_HOUR:-12}
      WATCH_EVERY: ${WATCH_EVERY:-60}
      PROJECT_SIMS: ${PROJECT_SIMS:-1000}
    volumes:
      - artifacts:/app/artifacts
      - data:/app/data

  # Bundled HTTPS proxy, only for servers where nothing else uses ports 80/443 (COMPOSE_PROFILES=caddy in .env).
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  artifacts:
  data:
  caddy_data:
  caddy_config:

{% extends "base.html" %}
{% block title %}Game{% endblock %}
{% block content %}
<div class="toolbar" style="margin-bottom:4px">
  <h1 style="margin:0" id="title">Game</h1><span class="badge" id="kind"></span>
  <span class="muted" id="sub"></span>
</div>
<p class="lede" id="explain"></p>
<div id="upset"></div>
<div id="why"></div>
<div class="muted" id="note"></div>
<div id="game"><div class="muted">Loading…</div></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='livegame.js') }}"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const gid = {{ game_id }}, season = new URLSearchParams(location.search).get("season") || "{{ live_season }}";
  const EXPLAIN = {
    pre: "Before tip-off: the model's prior for this game — win probability, projected box score, and the distribution of every stat for each team.",
    live: "In progress: every refresh reweights the posterior by the box score so far, updates this game's rates, and re-simulates the rest of the game. Refreshes every 20 seconds.",
    post: "Final: the Bayesian forecast replayed play by play from tip-off, against the prior. The win-probability line and the shift charts show how the evidence moved the forecast; red edges mark stats that finished outside the prior's central 95%.",
  };
  let timer = null;
  const rk = (t, m) => { const r = t === m.home ? m.rank_home : m.rank_away; return r ? `#${r}` : "non-D1"; };
  function upsetBanner(m, kind) {
    if (!m.underdog) return "";
    const dog = `<b>${m.underdog}</b> (${rk(m.underdog, m)})`, fav = `${m.favorite} (${rk(m.favorite, m)})`;
    if (kind === "post")
      return m.upset ? `<div class="upset-banner hot"><span class="badge upset">upset</span> ${dog} beat higher-ranked ${fav};
        the model gave it ${fmtPct(m.p_underdog)} before tip-off${m.upset_level ? ", and had flagged it" : ""}.</div>` : "";
    if (kind === "live" && m.p_underdog_live != null && (m.p_underdog_live >= 0.5 || m.upset_level))
      return `<div class="upset-banner ${m.p_underdog_live >= 0.5 ? "hot" : ""}"><span class="badge ${m.p_underdog_live >= 0.5 ? "upset" : "watch"}">${m.p_underdog_live >= 0.5 ? "upset in progress" : "upset watch"}</span>
        ${dog} now has a <b>${fmtPct(m.p_underdog_live)}</b> chance against ${fav} (${fmtPct(m.p_underdog)} before tip-off).</div>`;
    if (!m.upset_level) return "";
    return `<div class="upset-banner ${m.upset_level === "pick" ? "hot" : ""}"><span class="badge ${m.upset_level === "pick" ? "upset" : "watch"}">${m.upset_level === "pick" ? "upset pick" : "upset watch"}</span>
      Lower-ranked ${dog} has a <b>${fmtPct(m.p_underdog)}</b> chance against ${fav}.</div>`;
  }
  await load();
  async function load() {
    const r = await fetch(`/api/game?season=${season}&id=${gid}`);
    if (!r.ok) { $("game").innerHTML = `<div class="muted">${await r.text()}</div>`; return; }
    const d = await r.json(), m = d.meta;
    $("title").innerHTML = `<a href="/team/${encodeURIComponent(m.away)}?season=${season}">${m.away}</a> ${m.neutral ? "vs" : "@"}
      <a href="/team/${encodeURIComponent(m.home)}?season=${season}">${m.home}</a>`;
    $("kind").textContent = m.no_result ? "No result" : { pre: "Upcoming", live: "Live", post: "Final" }[d.kind];
    $("sub").textContent = `${new Date(m.date).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}` +
      `${m.tournament ? " · NCAA tournament" : ""} · model: ${d.posterior}`;
    $("explain").textContent = m.no_result
      ? "No result has been recorded for this game, though it was scheduled well over six hours ago: it was most likely postponed or cancelled. What follows is the forecast the model would have made before tip-off, not a result."
      : EXPLAIN[d.kind];
    const notes = [];
    if (m.note) notes.push(m.note);
    if (m.ledger) notes.push(`Forecast logged before the game (${m.ledger.model}): ${m.home} ${fmtPct(m.ledger.p_home)}; whole-box-score unusualness ${m.ledger.unusualness.toFixed(3)}.`);
    else if (d.kind === "post") notes.push("This game has no pre-game ledger entry, so the prior shown comes from the current model (for regular-season games of a finished season, that model was fitted on this game too).");
    $("note").textContent = notes.join(" ");
    $("upset").innerHTML = upsetBanner(m, d.kind);
    $("why").innerHTML = m.explanations ? `<div class="panel" style="margin:8px 0"><b>What this game did to the ratings</b>` +
      Object.entries(m.explanations).map(([t, e]) => `<div style="margin-top:6px"><b>${t}</b>
        <span style="color:${e.dnet >= 0 ? "var(--win)" : "var(--upset)"}">${e.headline}</span>
        ${e.evidence.length ? `<ul class="mini muted" style="margin:2px 0 0 18px; padding:0">${e.evidence.map((x) => `<li>${x}</li>`).join("")}</ul>` : ""}</div>`).join("") +
      perfPanel(m.explanations) + `</div>` : "";
    if (!d.model) { $("game").innerHTML = `<div class="muted">One of these teams is not in the model.</div>`; return; }
    LiveGame.render($("game"), d, { mode: d.kind === "live" ? "live" : d.kind });
    clearTimeout(timer);
    if (d.kind === "live") timer = setTimeout(load, 20000);
  }
  // Performance against expectation, stat by stat in points per 100 possessions, beside the rating change
  // each matching skill got from it.
  function perfPanel(ex) {
    const teams = Object.entries(ex).filter(([, e]) => e.performance && e.performance.rows.length);
    if (!teams.length) return "";
    const all = teams.flatMap(([, e]) => e.performance.rows.filter((r) => !r.style));
    const maxP = Math.max(1, ...teams.map(([, e]) => Math.abs(e.performance.total)), ...all.map((r) => Math.abs(r.points)));
    const maxR = Math.max(0.2, ...teams.map(([, e]) => Math.abs(e.performance.rating_change || 0)),
      ...all.map((r) => Math.abs(r.rating_change || 0)));
    const sign = (v, d = 1) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
    const pct = (v) => (100 * v).toFixed(0) + "%";
    const chart = (t, perf) => {
      const rows = [{ label: "Overall", points: perf.total, rating_change: perf.rating_change, total: true }]
        .concat(perf.rows.filter((r) => !r.style));
      const W = 900, rowH = 22, L = 210, mid1 = L + 190, half1 = 150, mid2 = L + 560, half2 = 85;
      const H = rows.length * rowH + 26;
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t}: performance against expectation">`;
      s += `<text x="${mid1}" y="12" text-anchor="middle" class="mini">vs expected (pts / 100 poss.)</text>
        <text x="${mid2}" y="12" text-anchor="middle" class="mini">rating moved</text>
        <line x1="${mid1}" x2="${mid1}" y1="18" y2="${H}" stroke="var(--line)"/><line x1="${mid2}" x2="${mid2}" y1="18" y2="${H}" stroke="var(--line)"/>`;
      rows.forEach((r, i) => {
        const y = 22 + i * rowH, col = (v) => (v >= 0 ? "var(--win)" : "var(--upset)");
        const w1 = Math.abs(r.points) / maxP * half1, x1 = r.points >= 0 ? mid1 : mid1 - w1;
        const tip = r.total ? `${t}: ${sign(r.points)} points per 100 possessions against expectation in all; rating ${sign(r.rating_change || 0)}`
          : `${r.label}: ${r.count} of ${r.of} (${pct(r.actual)}), the model expected ${r.expected_count.toFixed(1)} (${pct(r.expected)}). ` +
            `Worth ${sign(r.points)} points per 100 possessions` + (r.rating_change != null ? `; this skill moved the rating ${sign(r.rating_change, 2)}` : "");
        s += `<g><title>${tip}</title><rect x="0" y="${y - 2}" width="${W}" height="${rowH}" fill="transparent"/>
          <text x="${L - 8}" y="${y + 12}" text-anchor="end" style="fill:var(--ink)${r.total ? ";font-weight:700" : ""}">${r.label}</text>
          <rect x="${x1}" y="${y + 2}" width="${Math.max(1, w1)}" height="${rowH - 8}" rx="2" fill="${col(r.points)}" opacity="${r.total ? 1 : 0.75}"/>
          <text x="${r.points >= 0 ? x1 + w1 + 4 : x1 - 4}" y="${y + 12}" text-anchor="${r.points >= 0 ? "start" : "end"}" class="mini">${sign(r.points)}</text>`;
        if (r.rating_change != null) {
          const w2 = Math.abs(r.rating_change) / maxR * half2, xx = r.rating_change >= 0 ? mid2 : mid2 - w2;
          s += `<rect x="${xx}" y="${y + 4}" width="${Math.max(1, w2)}" height="${rowH - 12}" rx="2" fill="${col(r.rating_change)}" opacity="${r.total ? 1 : 0.6}"/>
            <text x="${r.rating_change >= 0 ? xx + w2 + 4 : xx - 4}" y="${y + 12}" text-anchor="${r.rating_change >= 0 ? "start" : "end"}" class="mini">${sign(r.rating_change, 2)}</text>`;
        }
        s += `</g>`;
      });
      return s + `</svg>`;
    };
    const partial = teams.some(([, e]) => !e.performance.complete);
    return `<div style="margin-top:10px"><b>Performance against expectation</b>
      <div class="muted mini" style="margin:2px 0 4px">For each part of the game, what happened against what the model expected
        from both teams beforehand, valued at what that stat is worth in points per 100 possessions. Green helped the team,
        red hurt it. Beside it, how far that same skill moved the team's rating: a bigger surprise moves it more, but by much
        less than the game itself, because one game is weighed against everything seen before. Skills the model sees as
        linked can also move together, so a small bar can point the other way. Hover a row for the numbers.
        ${partial ? "This game was rated before the full breakdown was kept, so only its biggest surprises are shown." : ""}</div>
      ${teams.map(([t, e]) => `<div style="margin-top:6px"><b class="mini">${t}</b>${chart(t, e.performance)}</div>`).join("")}</div>`;
  }
})();
</script>
{% endblock %}

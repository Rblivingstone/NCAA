<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dashboard{% endblock %} · {{ site_name }} {{ season_label }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a href="/" class="brand">🏀 {{ site_name }} <span class="brand-season">{{ season_label }} season</span></a>
  <a href="/" class="{{ 'active' if page == 'dashboard' }}">Dashboard</a>
  <a href="/live" class="{{ 'active' if page == 'live' }}">Live</a>
  <a href="/games" class="{{ 'active' if page == 'games' }}">Games</a>
  <a href="/season" class="{{ 'active' if page == 'season' }}">Season</a>
  <a href="/rankings" class="{{ 'active' if page == 'rankings' }}">Rankings</a>
  <a href="/matchup" class="{{ 'active' if page == 'matchup' }}">Simulate a game</a>
  <span class="sep"></span><span class="group">{{ season }} tournament</span>
  <a href="/bracket" class="{{ 'active' if page == 'bracket' }}">Distribution bracket</a>
  <a href="/score" class="{{ 'active' if page == 'score' }}">Score a bracket</a>
</nav>
<main>{% block content %}{% endblock %}</main>
<div id="tooltip"></div>
<script src="{{ url_for('static', filename='bracket.js') }}"></script>
<script src="{{ url_for('static', filename='tables.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>

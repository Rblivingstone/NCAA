{% extends "base.html" %}
{% block title %}{{ team }}{% endblock %}
{% block content %}
<div class="toolbar" style="margin-bottom:4px">
  <h1 style="margin:0">{{ team }}</h1>
  <label>Season <select id="season">{% for s in seasons|reverse %}<option>{{ s }}</option>{% endfor %}</select></label>
  <span class="muted" id="model"></span>
</div>
<div id="out"><div class="muted">Loading…</div></div>
{% endblock %}
{% block scripts %}
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const team = {{ team|tojson }};
  const q = new URLSearchParams(location.search);
  if (q.get("season")) $("season").value = q.get("season");
  $("season").onchange = load;
  await load();

  async function load() {
    const r = await fetch(`/api/team?season=${$("season").value}&name=${encodeURIComponent(team)}`);
    if (!r.ok) { $("out").innerHTML = `<div class="muted">${await r.text()}</div>`; return; }
    const d = await r.json(), R = d.rating;
    $("model").textContent = `model: ${d.posterior}`;
    const stat = (v, k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
    let h = `<div class="stats">${stat("#" + R.rank, "overall rank")}${stat((R.net >= 0 ? "+" : "") + R.net.toFixed(1),
        `net rating per 100 possessions<br>90%: ${R.net_lo.toFixed(1)} to ${R.net_hi.toFixed(1)}`)}
      ${stat(R.ortg.toFixed(1), "offense (pts / 100 poss)")}${stat(R.drtg.toFixed(1), "defense (allowed / 100 poss)")}
      ${stat(d.tempo.possessions.toFixed(0), "possessions per 40 min")}${stat((R.trend >= 0 ? "+" : "") + R.trend.toFixed(1), "change in form this season")}</div>`;
    h += `<div class="panel" style="margin-top:12px"><b>Assessment</b><ul class="assess">${d.assessment.map((l) => `<li>${l}</li>`).join("")}</ul></div>`;
    h += `<div class="cols2" style="margin-top:12px"><div class="panel"><b>How our assessment has moved</b>${trend(d)}</div>
      <div class="panel"><b>Opponent styles: what hurts this team</b>
      <div class="muted" style="margin:4px 0 6px">Change in net efficiency (pts/100) against an average opponent made one standard deviation
        better at one thing, <em>relative to how that style hurts an average team</em>. Red = exposed, green = handles it well. These are
        second-order effects: the model has no explicit matchup terms, so they come from how the team's own rates combine.</div>
      ${styleChart(d.styles)}</div></div>`;
    h += `<div class="panel" style="margin-top:12px"><b>Core strengths and weaknesses</b>
      <div class="muted" style="margin:4px 0 6px">Each skill's contribution: how many points per 100 possessions the team's offense scores
        (or its defense saves) because of it, versus an average D1 team at that skill. Bar = 90% credible interval.</div>${profileTable(d.profile)}</div>`;
    h += marchPanel(d.march);
    h += whyPanel(d.explanations || []);
    h += streakPanel(d.streaks);
    h += `<div class="panel" style="margin-top:12px"><b>Games</b><div class="scroll" style="max-height:420px">${gamesTable(d)}</div></div>`;
    $("out").innerHTML = h;
  }

  function marchPanel(m) {
    const head = `<div class="panel" style="margin-top:12px"><b>Road to March</b> <a class="mini" href="/march">all teams →</a>`;
    if (!m) return head + `<div class="muted" style="margin-top:4px">No season projection yet: it runs after each nightly update.</div></div>`;
    const pct = (v) => (v == null ? "—" : v < 0.001 && v > 0 ? "<0.1%" : v >= 0.999 && v < 1 ? ">99.9%" : fmtPct(v));
    const stat = (v, k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
    let h = head + `<div class="muted mini" style="margin:4px 0 8px">From ${m.n_sims.toLocaleString()} simulations of the rest of the season
      (updated ${new Date(m.updated).toLocaleDateString()}). Now ${m.wins_now}–${m.losses_now}.</div>`;
    h += `<div class="stats">${stat(`${Math.round(m.wins)}–${Math.round(m.losses)}`, `projected record (80%: ${Math.round(m.wins_lo)}–${Math.round(m.wins_hi)} wins)`)}
      ${stat(pct(m.p_conf_regular), `${m.conference} regular-season title`)}${stat(pct(m.p_conf_tourney), `${m.conference} tournament title`)}
      ${stat(pct(m.p_field), "makes the NCAA tournament")}${stat(m.avg_seed ? m.avg_seed.toFixed(1) : "—", "average seed, when in")}
      ${stat(pct(m.reach["Final Four"]), "reaches the Final Four")}${stat(`<b>${pct(m.reach.Champion)}</b>`, "wins the national title")}</div>`;
    // the projected team sheet, and where it would likely play
    if (m.sheet) {
      const q = m.sheet, top = (o) => Object.entries(o || {}).sort((a, b) => b[1] - a[1]);
      const reg = top(m.regions)[0], sites = top(m.sites).slice(0, 2);
      h += `<div class="stats" style="margin-top:8px">${stat(Math.round(q.net_rank), `projected NET-style rank (80%: ${Math.round(q.net_rank_lo)}–${Math.round(q.net_rank_hi)})`)}
        ${stat((q.wab >= 0 ? "+" : "") + q.wab.toFixed(1), "wins above bubble")}
        ${stat(`${q.q1w.toFixed(1)}–${q.q1l.toFixed(1)}`, "Quadrant 1 record")}${stat(q.q34l.toFixed(1), "Quadrant 3–4 losses")}
        ${reg ? stat(reg[0], `most likely region (${pct(reg[1])} when in)`) : ""}
        ${sites.length ? stat(sites[0][0], `most likely first-round site (${pct(sites[0][1])})` + (sites[1] ? `; next ${sites[1][0]}` : "")) : ""}</div>`;
    }
    // how far it goes: the chance to reach each round
    const rounds = ["Round of 64", "Round of 32", "Sweet 16", "Elite 8", "Final Four", "Final", "Champion"];
    const W = 900, H = 120, L = 10, bw = (W - 2 * L) / rounds.length;
    let f = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
    rounds.forEach((r, i) => { const v = m.reach[r] || 0, bh = v * (H - 40);
      f += `<rect x="${L + i * bw + 6}" y="${H - 22 - bh}" width="${bw - 12}" height="${bh}" rx="3" fill="var(--accent)" opacity="${0.35 + 0.65 * (i / (rounds.length - 1))}"><title>${r}: ${pct(v)}</title></rect>
        <text x="${L + (i + 0.5) * bw}" y="${H - 22 - bh - 4}" text-anchor="middle" style="fill:var(--ink)">${pct(v)}</text>
        <text x="${L + (i + 0.5) * bw}" y="${H - 6}" text-anchor="middle">${r}</text>`; });
    f += `</svg>`;
    // seed distribution
    const sd = m.seed_dist, smax = Math.max(...sd, 0.001), H2 = 90, bw2 = (W - 2 * L) / 16;
    let g = `<svg viewBox="0 0 ${W} ${H2}" width="100%">`;
    sd.forEach((v, i) => { const bh = v / smax * (H2 - 34);
      g += `<rect x="${L + i * bw2 + 4}" y="${H2 - 18 - bh}" width="${bw2 - 8}" height="${bh}" rx="2" fill="var(--hl)" opacity=".75"><title>${i + 1} seed: ${pct(v)}</title></rect>
        <text x="${L + (i + 0.5) * bw2}" y="${H2 - 4}" text-anchor="middle">${i + 1}</text>`; });
    g += `</svg>`;
    h += `<div class="cols2" style="margin-top:8px"><div><b class="mini">How far it goes</b>${f}</div>
      <div><b class="mini">Seed, when selected</b>${sd.some((v) => v > 0) ? g : '<div class="muted mini">Not selected in any simulation.</div>'}</div></div>`;
    // odds over time, once there are two nightly projections
    const hist = m.history || [];
    if (hist.length >= 2) {
      const HW = 900, HH = 150, HL = 44, HR = 14, HT = 10, HB = 22, n = hist.length;
      const hx = (i) => HL + i / (n - 1) * (HW - HL - HR), hy = (v) => HT + (1 - v) * (HH - HT - HB);
      let c = `<svg viewBox="0 0 ${HW} ${HH}" width="100%">`;
      [0, 0.5, 1].forEach((t) => (c += `<line x1="${HL}" x2="${HW - HR}" y1="${hy(t)}" y2="${hy(t)}" stroke="var(--line)"/><text x="${HL - 5}" y="${hy(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`));
      const ln = (k, col, dash) => `<polyline points="${hist.map((p, i) => `${hx(i)},${hy(p[k])}`).join(" ")}" fill="none" stroke="${col}" stroke-width="2.5" ${dash ? 'stroke-dasharray="6 4"' : ""}/>`;
      c += ln("p_field", "var(--accent)") + ln("p_final_four", "var(--hl)", true) + ln("p_champion", "var(--ink)");
      c += hist.map((p, i) => `<rect x="${hx(i) - 5}" y="${HT}" width="10" height="${HH - HT - HB}" fill="transparent"><title>${p.date}: field ${pct(p.p_field)} · Final Four ${pct(p.p_final_four)} · title ${pct(p.p_champion)}</title></rect>`).join("");
      c += `<text x="${HL}" y="${HH - 5}">${hist[0].date.slice(5)}</text><text x="${HW - HR}" y="${HH - 5}" text-anchor="end">${hist[n - 1].date.slice(5)}</text></svg>`;
      h += `<div style="margin-top:8px"><b class="mini">Odds over time</b>${c}<div class="muted mini"><span style="color:var(--accent)">━</span> makes the field
        &nbsp; <span style="color:var(--hl)">╍</span> Final Four &nbsp; <b>━</b> national title · one point per nightly projection</div></div>`;
    }
    return h + `</div>`;
  }

  function whyPanel(list) {
    let h = `<div class="panel" style="margin-top:12px"><b>Why did the rating move?</b>
      <div class="muted mini" style="margin:4px 0 8px">Each game's update, explained: which skills moved the rating (in points per 100
        possessions), and the box-score numbers behind it, against what the model expected given the attempts and the opponent.</div>`;
    if (!list.length) return h + `<div class="muted">No explanations yet. They're recorded for every game folded in from now on.</div></div>`;
    h += list.slice(0, 12).map((e) => `<div style="border-top:1px solid var(--line); padding:8px 0">
        <div><b>${e.date.slice(5)} vs ${e.opponent}</b> <a class="mini" href="/game/${e.game_id}?season=${$("season").value}">game →</a>
          <span style="color:${e.dnet >= 0 ? "var(--win)" : "var(--upset)"}; margin-left:6px">${e.headline}</span></div>
        ${e.evidence.length ? `<ul class="mini muted" style="margin:4px 0 0 18px; padding:0">${e.evidence.map((x) => `<li>${x}</li>`).join("")}</ul>` : ""}</div>`).join("");
    return h + (list.length > 12 ? `<div class="muted mini">Showing the latest 12 of ${list.length}.</div>` : "") + `</div>`;
  }

  function streakPanel(s) {
    const head = `<div class="panel" style="margin-top:12px"><b>Is the winning real?</b>
      <div class="muted" style="margin:4px 0 8px">Two things move when a team plays: its <b>results</b> against what the model expected
        (a win it gave 30% counts +0.7, a loss it gave 80% counts −0.8), and its <b>rating</b>, which each game's box score moves up when the
        team played better than expected against that opponent, win or lose. Winning because a team is better moves both. Wins
        the box scores don't back up are the kind that tend not to last.</div>`;
    if (!s || !s.games) return head + `<div class="muted">No games folded into this team's rating yet.</div></div>`;
    const sgn = (v, d = 1) => (v >= 0 ? "+" : "") + v.toFixed(d);
    const st = s.streak, lv = s.verdict.level;
    const colour = { unearned: "var(--upset)", lucky: "var(--upset)", earned: "var(--win)", unlucky: "var(--accent)" }[lv] || "var(--ink)";
    const stat = (v, k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
    let h = head + `<div class="upset-banner" style="background:var(--accent-soft)"><b style="color:${colour}">${lv[0].toUpperCase() + lv.slice(1)}.</b> ${s.verdict.text}</div>`;
    h += `<div class="stats">${stat(`${s.wins}–${s.losses}`, "record")}${stat(s.expected_wins.toFixed(1), `wins the model expected (${s.games_with_forecast} games forecast)`)}
      ${stat(sgn(s.beyond), "wins beyond expectation")}${stat(sgn(s.rating_change), "rating change from the box scores (pts/100)")}
      ${stat(sgn(s.unexplained), `unexplained wins: beyond expectation, minus what the rating gain accounts for ${s.unexplained_pct != null ? ` (${s.unexplained_pct >= 0.995 ? `the most of all ${s.league_teams} teams` : s.unexplained_pct <= 0.005 ? `the fewest of all ${s.league_teams} teams` : `more than ${Math.round(100 * s.unexplained_pct)}% of teams`})` : ""}`)}
      ${stat(`${st.kind || "—"}${st.length || ""}`, st.kind ? `current streak, rating ${sgn(st.rating_change)} over it (${sgn(st.per_game)} a game)` : "current streak")}
      ${stat(`${s.close_wins}–${s.close_losses}`, "record in games decided by 5 or fewer")}
      ${stat(s.unearned_wins, "wins where the box score pulled the rating down")}</div>`;
    const G = s.games_list;
    if (G.length >= 2) {
      // top: cumulative wins beyond expectation vs what the rating gain explains (same units: wins)
      const W = 900, H = 170, L = 44, R = 14, T = 12, B = 22, n = G.length;
      let cb = 0, cd = 0; const beyond = [0], expl = [0];
      G.forEach((g) => { cb += g.p_pre != null ? (g.won ? 1 : 0) - g.p_pre : 0; cd += g.dnet; beyond.push(cb); expl.push(s.slope * cd); });
      const lo = Math.min(-0.5, ...beyond, ...expl), hi = Math.max(0.5, ...beyond, ...expl);
      const x = (i) => L + i / n * (W - L - R), y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
      let c = `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
        <text x="${L - 5}" y="${y(0) + 4}" text-anchor="end">0</text><text x="${L - 5}" y="${y(hi) + 10}" text-anchor="end">${sgn(hi)}</text><text x="${L - 5}" y="${y(lo)}" text-anchor="end">${sgn(lo)}</text>`;
      c += `<polygon points="${beyond.map((v, i) => `${x(i)},${y(v)}`).join(" ")} ${expl.slice().reverse().map((v, j) => `${x(n - j)},${y(v)}`).join(" ")}" fill="${cb - s.slope * cd > 0 ? "var(--upset)" : "var(--accent)"}" opacity=".12"/>`;
      c += `<polyline points="${expl.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>
        <polyline points="${beyond.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2.5"/></svg>`;
      // bottom: each game's rating change, marked by the result
      const H2 = 120, m = Math.max(1, ...G.map((g) => Math.abs(g.dnet))), y2 = (v) => H2 / 2 - v / m * (H2 / 2 - 14), bw = (W - L - R) / n;
      let b = `<svg viewBox="0 0 ${W} ${H2}" width="100%"><line x1="${L}" x2="${W - R}" y1="${y2(0)}" y2="${y2(0)}" stroke="var(--line)"/>
        <text x="${L - 5}" y="${y2(m) + 10}" text-anchor="end">${sgn(m)}</text><text x="${L - 5}" y="${y2(-m)}" text-anchor="end">${sgn(-m)}</text>`;
      G.forEach((g, i) => {
        const cx = L + (i + 0.5) * bw, w = Math.max(2, Math.min(22, bw * 0.6));
        b += `<rect x="${cx - w / 2}" y="${Math.min(y2(0), y2(g.dnet))}" width="${w}" height="${Math.abs(y2(g.dnet) - y2(0))}" rx="2"
          fill="${g.dnet >= 0 ? "var(--win)" : "var(--upset)"}" opacity=".65"><title>${g.date} ${g.won ? "W" : "L"} ${g.pts}–${g.opp_pts} vs ${g.opponent}: rating ${sgn(g.dnet)}${g.p_pre != null ? `, pre-game ${fmtPct(g.p_pre)}` : ""}</title></rect>
          <text x="${cx}" y="${H2 - 2}" text-anchor="middle" style="fill:${g.won ? "var(--ink)" : "var(--muted)"};font-weight:${g.won ? 700 : 400}">${n <= 40 ? (g.won ? "W" : "L") : ""}</text>`;
      });
      b += `</svg>`;
      h += `<div style="margin-top:8px">${c}<div class="muted mini"><b style="color:var(--ink)">━</b> wins beyond expectation, game by game ·
          <span style="color:var(--accent)">╍</span> what the rating gain accounts for (${s.slope.toFixed(2)} extra wins per point of rating, fitted across ${s.league_teams} D1 teams) ·
          shaded: the gap, i.e. unexplained wins</div>${b}<div class="muted mini">Each game's rating change from its box score
          (green up, red down), with the result below. A run of Ws over red bars is winning without playing better than expected.</div></div>`;
    }
    return h + `</div>`;
  }

  function trend(d) {
    // Within-season form by two-week period, plus nightly snapshots when the season is being tracked.
    const f = d.form, hist = d.history;
    const W = 520, H = 190, padL = 40, pad = 22;
    const pts = f.map((p) => ({ t: new Date(p.date).getTime(), v: d.rating.net + p.net, lo: d.rating.net + p.net_lo, hi: d.rating.net + p.net_hi }));
    const hp = hist.map((p) => ({ t: new Date(p.date).getTime(), v: p.net, lo: p.net_lo, hi: p.net_hi }));
    // Every game's Bayesian update: the rating before the first game, then after each one (±1.645 sd).
    const ups = d.updates || [];
    const gp = ups.length ? [{ t: new Date(ups[0].date).getTime() - 864e5, v: ups[0].net_before, lo: ups[0].net_before - 1.645 * ups[0].sd_before,
      hi: ups[0].net_before + 1.645 * ups[0].sd_before, label: "start" }].concat(ups.map((u) => ({ t: new Date(u.date).getTime(), v: u.net_after,
      lo: u.net_after - 1.645 * u.sd_after, hi: u.net_after + 1.645 * u.sd_after, label: `${u.pts > u.opp_pts ? "W" : "L"} ${u.pts}–${u.opp_pts} vs ${u.opponent}` }))) : [];
    const all = (gp.length ? gp : pts).concat(hp);
    if (!all.length) return `<div class="muted">No history yet.</div>`;
    const t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(...all.map((p) => p.t), t0 + 864e5);
    const v0 = Math.min(...all.map((p) => p.lo)) - 1, v1 = Math.max(...all.map((p) => p.hi)) + 1;
    const x = (t) => padL + (t - t0) / (t1 - t0) * (W - padL - pad), y = (v) => H - pad - (v - v0) / (v1 - v0) * (H - 2 * pad);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="team strength over time">`;
    for (const v of [v0 + 1, (v0 + v1) / 2, v1 - 1]) s += `<line x1="${padL}" x2="${W - pad}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL - 4}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(0)}</text>`;
    if (gp.length) {
      s += `<path d="M${gp.map((p) => `${x(p.t)},${y(p.hi)}`).join("L")}L${gp.slice().reverse().map((p) => `${x(p.t)},${y(p.lo)}`).join("L")}Z" fill="var(--accent-soft)"/>`;
      s += `<polyline points="${gp.map((p) => `${x(p.t)},${y(p.v)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
      s += gp.map((p) => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"><title>${p.label}: ${p.v.toFixed(1)}</title></circle>`).join("");
    } else if (pts.length > 1) {
      s += `<path d="M${pts.map((p) => `${x(p.t)},${y(p.hi)}`).join("L")}L${pts.slice().reverse().map((p) => `${x(p.t)},${y(p.lo)}`).join("L")}Z" fill="var(--accent-soft)"/>`;
      s += `<polyline points="${pts.map((p) => `${x(p.t)},${y(p.v)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    }
    if (hp.length) s += hp.map((p) => `<line x1="${x(p.t)}" x2="${x(p.t)}" y1="${y(p.lo)}" y2="${y(p.hi)}" stroke="var(--ink)" opacity=".5"/>
      <circle cx="${x(p.t)}" cy="${y(p.v)}" r="3.5" fill="var(--ink)"/>`).join("");
    const fmt = (t) => new Date(t).toLocaleDateString([], { month: "short", day: "numeric" });
    s += `<text x="${padL}" y="${H - 6}">${fmt(t0)}</text><text x="${W - pad}" y="${H - 6}" text-anchor="end">${fmt(t1)}</text></svg>`;
    return s + (gp.length
      ? `<div class="muted">Blue: the net rating after each game's Bayesian update (shaded: 90% interval), starting from the season's
          prior; hover a point for the game. ${hp.length ? "Black: the nightly snapshots." : ""}</div>`
      : `<div class="muted">Blue: net rating through the season implied by the model's two-week form (shaded: approximate 90% band).
          ${hp.length ? "Dots: the rating each nightly fit gave, with 90% intervals." : "Nightly snapshots appear here once the season is being updated."}</div>`);
  }

  function styleChart(styles) {
    const max = Math.max(0.5, ...styles.map((s) => Math.max(Math.abs(s.relative_lo), Math.abs(s.relative_hi))));
    return `<table class="data styles">` + styles.map((s) => {
      const c = s.relative < 0 ? "var(--upset)" : "var(--win)";
      const pos = (v) => 50 + v / max * 50;
      return `<tr><td>${s.style}</td><td class="num" style="color:${Math.abs(s.relative) > 0.1 && (s.p_worse > 0.8 || s.p_worse < 0.2) ? c : "inherit"}">${s.relative >= 0 ? "+" : ""}${s.relative.toFixed(2)}</td>
        <td style="width:45%"><div class="divbar"><span class="mid"></span>
          <span class="ci" style="left:${pos(s.relative_lo)}%;width:${pos(s.relative_hi) - pos(s.relative_lo)}%"></span>
          <span class="pt" style="left:${pos(s.relative)}%;background:${c}"></span></div></td>
        <td class="num muted">${s.relative < 0 ? fmtPct(s.p_worse) + " sure" : fmtPct(1 - s.p_worse) + " sure"}</td></tr>`;
    }).join("") + `</table>`;
  }

  function profileTable(profile) {
    const max = Math.max(1, ...profile.map((r) => Math.max(Math.abs(r.impact_lo), Math.abs(r.impact_hi))));
    const pos = (v) => 50 + v / max * 50;
    const sec = (side, title) => `<tr><th colspan="3">${title}</th><th class="num">vs D1 teams</th></tr>` + profile.filter((r) => r.side === side)
      .sort((a, b) => b.impact - a.impact).map((r) => `<tr><td>${r.label}${r.style ? ' <span class="muted">(style)</span>' : ""}</td>
        <td class="num">${r.impact >= 0 ? "+" : ""}${r.impact.toFixed(1)}</td>
        <td style="width:40%"><div class="divbar"><span class="mid"></span>
          <span class="ci" style="left:${pos(r.impact_lo)}%;width:${pos(r.impact_hi) - pos(r.impact_lo)}%"></span>
          <span class="pt" style="left:${pos(r.impact)}%;background:${r.impact >= 0 ? "var(--win)" : "var(--upset)"}"></span></div></td>
        <td class="num muted" style="white-space:nowrap">${r.style ? "more than" : "better than"} ${Math.round(100 * r.percentile)}%</td></tr>`).join("");
    return `<div class="cols2"><table class="data">${sec("off", "Offense")}</table><table class="data">${sec("def", "Defense")}</table></div>`;
  }

  function gamesTable(d) {
    if (!d.games.length) return `<div class="muted">No games in this season's schedule.</div>`;
    return `<table class="data"><tr><th>Date</th><th>Game</th><th class="num">Result</th><th class="num">Pre-game P(${team} wins)</th><th class="num">Unusualness</th></tr>` +
      d.games.map((g) => {
        const home = g.home === team, opp = home ? g.away : g.home;
        const p = g.p_home_pregame != null ? (home ? g.p_home_pregame : 1 - g.p_home_pregame) : null;
        const res = g.score ? (() => { const [a, b] = home ? g.score : [g.score[1], g.score[0]]; return `${a > b ? "W" : "L"} ${a}–${b}`; })() : "";
        return `<tr><td>${new Date(g.date).toLocaleDateString([], { month: "short", day: "numeric" })}</td>
          <td><a href="/game/${g.game_id}?season=${d.season}">${home ? "vs" : g.neutral ? "vs" : "@"} ${opp}</a>${g.neutral ? ' <span class="muted">(neutral)</span>' : ""}</td>
          <td class="num">${res || (g.no_result ? '<span class="muted" title="Well past tip-off with no result: probably postponed or cancelled">no result</span>' : '<span class="muted">upcoming</span>')}</td><td class="num">${p != null ? fmtPct(p) : ""}</td>
          <td class="num" style="color:${g.unusualness < 0.05 ? "var(--upset)" : "inherit"}">${g.unusualness != null ? g.unusualness.toFixed(3) : ""}</td></tr>`;
      }).join("") + `</table>`;
  }
})();
</script>
{% endblock %}
